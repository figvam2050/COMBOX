[env:genericGD32F305]
platform = ststm32
board = genericSTM32F103RC
framework = arduino

; --- Programming / monitor ---
upload_protocol = stlink
monitor_speed = 115200

; IMPORTANT:
; We use genericSTM32F103RC for hardware/register compatibility.
; However, the actual chip is GD32F305RCT6, so we use a custom linker script
; with 96KB of RAM.
; Keep the original Felicity bootloader at 0x08000000..0x08003FFF.
; Application starts at 0x08004000.
board_upload.offset_address = 0x08004000
board_build.ldscript = GD32F305RC_COMBOX.ld

build_flags =
    -D HSE_VALUE=8000000U
    -D GD32F305
    -D VECT_TAB_OFFSET=0x00004000U
    -D HAL_USART_MODULE_ENABLED
    -D HAL_GPIO_MODULE_ENABLED
    -D HAL_RCC_MODULE_ENABLED
    -D HAL_CORTEX_MODULE_ENABLED
